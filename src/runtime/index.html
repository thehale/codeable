<!-- 
 Purpose: HTML structure for the browser based IDE for Codeable
 Date: 29 Apr 2022
 Version: 0.1.0
  -->
<html>

<head>
  <script type="text/javascript" src="tau-prolog.js"></script>
  <link rel="stylesheet" type="text/css" href="ide.css"/>
</head>

<body>
  <div id="editor">
    <label for="code">Type your code here!</label>
    <button id="run">Run</button>
    <br/>
    <label id="examples-label" for="examples">Load an example:</label>
    <select id="examples">
      <option value="">-- Select an example --</option>
      <option value="hello_world">Hello World</option>
      <option value="factorial">Factorial</option>
      <option value="fibonacci">Fibonacci</option>
      <option value="quadratic_formula">Quadratic Formula</option>
      <option value="range_count">Range Count</option>
    </select>
    <br/>
    <textarea id="code" name="code"></textarea>
  </div>
  <div id="output">
    <label id="output-label" for="code">Output</label>
    <br/>
    <textarea id="results" name="results" disabled></textarea>
  </div>
  
  <script type="text/javascript" src="./ide.js"></script>
</body>

</html>
